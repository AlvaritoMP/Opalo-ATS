[variables]
# Nixpacks, al ver una app Vite, instala Caddy desde Nix. En el VPS esa
# descarga se queda decenas de minutos. El estático lo sirve Node.
NIXPACKS_SPA_CADDY = "false"

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "node scripts/serve-spa.mjs"
